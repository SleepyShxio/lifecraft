<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="70%" cy="22%" r="95%">
      <stop offset="0" stop-color="#2b2a7a"/>
      <stop offset=".45" stop-color="#121848"/>
      <stop offset="1" stop-color="#060914"/>
    </radialGradient>
    <linearGradient id="aur" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6ef0d2"/>
      <stop offset=".55" stop-color="#8f7dff"/>
      <stop offset="1" stop-color="#ff7fd1"/>
    </linearGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset=".45" stop-color="#ffcf6b"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity=".75"/>
      <stop offset=".4" stop-color="#ff9a3c" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="sq"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- faint background stars -->
    <g fill="#fff">
      <circle cx="96" cy="104" r="4" opacity=".7"/><circle cx="168" cy="62" r="2.5" opacity=".5"/>
      <circle cx="430" cy="300" r="3" opacity=".55"/><circle cx="70" cy="250" r="2.5" opacity=".45"/>
      <circle cx="250" cy="120" r="2" opacity=".5"/><circle cx="455" cy="440" r="2.5" opacity=".4"/>
    </g>
    <!-- aurora ribbon: the learning path climbing to the star -->
    <path d="M40 470 C 150 440, 170 330, 250 300 S 340 220, 372 150" fill="none" stroke="url(#aur)" stroke-width="64" stroke-linecap="round" opacity=".55" filter="url(#glow)"/>
    <path d="M40 470 C 150 440, 170 330, 250 300 S 340 220, 372 150" fill="none" stroke="url(#aur)" stroke-width="26" stroke-linecap="round"/>
    <!-- level stars on the path -->
    <g fill="#ffffff">
      <circle cx="142" cy="420" r="17"/>
      <circle cx="250" cy="300" r="17"/>
    </g>
    <g fill="#0b1126"><circle cx="142" cy="420" r="7"/><circle cx="250" cy="300" r="7"/></g>
    <!-- the gold spark -->
    <circle cx="372" cy="150" r="150" fill="url(#halo)"/>
    <path d="M372 38 L398 124 L484 150 L398 176 L372 262 L346 176 L260 150 L346 124 Z" fill="url(#gold)"/>
    <path d="M372 92 L382 140 L430 150 L382 160 L372 208 L362 160 L314 150 L362 140 Z" fill="#fffbea" opacity=".85"/>
  </g>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="6"/>
</svg>
