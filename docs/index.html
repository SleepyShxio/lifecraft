<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Lifecraft</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Lifecraft: practical life skills and mission prep, one star at a time.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@400;600;800&display=swap">
<style>
@property --tint { syntax: '<color>'; inherits: true; initial-value: #6ef0d2; }
/* Layout: a star atlas. A live night sky sits behind one centered column (max 1120px);
   every course is a constellation and every level a star on a winding path. Dark-first. */
:root {
  --bg: #060914;
  --bg-2: #0b1126;
  --panel: rgba(16, 22, 46, .72);
  --panel-solid: #10162e;
  --panel-hi: rgba(30, 40, 80, .78);
  --line: rgba(150, 165, 255, .15);
  --line-strong: rgba(170, 185, 255, .32);
  --fg: #eceeff;
  --muted: #a3abcf;
  --faint: #67709a;
  --aurora: #6ef0d2;
  --aurora-2: #8f7dff;
  --gold: #ffcf6b;
  --good: #43e29a;
  --bad: #ff6f86;
  --on-accent: #04131a;
  --star-rgb: 236 240 255;
  --aurora-op: .34;
  --aurora-blend: screen;
  --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --m1: #6ef0d2; --m2: #ffcf6b; --m3: #a996ff; --m4: #ff9fc0; --m5: #7cc4ff; --m6: #b8f07a;
  --key: #182046; --key-edge: #070b1c; --scrim: rgba(3, 5, 14, .55);
  --tint: #6ef0d2;
  --font-display: 'Unbounded', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Atkinson Hyperlegible', 'Segoe UI', Roboto, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --t-xs: .75rem; --t-sm: .875rem; --t-md: 1.0625rem; --t-lg: 1.25rem; --t-xl: 1.6rem;
  --t-2xl: clamp(1.75rem, 1.1rem + 3vw, 3rem);
  --r-lg: 22px; --r-md: 16px; --r-sm: 11px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
  transition: --tint 1.2s ease;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #edf0fb; --bg-2: #e1e6f8; --panel: rgba(255, 255, 255, .74); --panel-solid: #ffffff; --panel-hi: rgba(255, 255, 255, .95);
    --line: rgba(36, 48, 120, .13); --line-strong: rgba(36, 48, 120, .28);
    --fg: #121834; --muted: #4a5378; --faint: #858db0;
    --aurora: #0b8f78; --aurora-2: #6550dc; --gold: #9c6500; --good: #0d8a50; --bad: #c92b4b; --on-accent: #ffffff;
    --star-rgb: 60 70 140; --aurora-op: .22; --aurora-blend: multiply; --shadow: 0 14px 36px rgba(30, 40, 100, .13);
    --m1: #0b8f78; --m2: #a86a00; --m3: #6550dc; --m4: #c43d78; --m5: #1f6fc4; --m6: #4f8a12;
    --key: #ffffff; --key-edge: #c3cae6; --scrim: rgba(18, 24, 52, .35);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #edf0fb; --bg-2: #e1e6f8; --panel: rgba(255, 255, 255, .74); --panel-solid: #ffffff; --panel-hi: rgba(255, 255, 255, .95);
  --line: rgba(36, 48, 120, .13); --line-strong: rgba(36, 48, 120, .28);
  --fg: #121834; --muted: #4a5378; --faint: #858db0;
  --aurora: #0b8f78; --aurora-2: #6550dc; --gold: #9c6500; --good: #0d8a50; --bad: #c92b4b; --on-accent: #ffffff;
  --star-rgb: 60 70 140; --aurora-op: .22; --aurora-blend: multiply; --shadow: 0 14px 36px rgba(30, 40, 100, .13);
  --m1: #0b8f78; --m2: #a86a00; --m3: #6550dc; --m4: #c43d78; --m5: #1f6fc4; --m6: #4f8a12;
  --key: #ffffff; --key-edge: #c3cae6; --scrim: rgba(18, 24, 52, .35);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #060914; --bg-2: #0b1126; --panel: rgba(16, 22, 46, .72); --panel-solid: #10162e; --panel-hi: rgba(30, 40, 80, .78);
  --line: rgba(150, 165, 255, .15); --line-strong: rgba(170, 185, 255, .32);
  --fg: #eceeff; --muted: #a3abcf; --faint: #67709a;
  --aurora: #6ef0d2; --aurora-2: #8f7dff; --gold: #ffcf6b; --good: #43e29a; --bad: #ff6f86; --on-accent: #04131a;
  --star-rgb: 236 240 255; --aurora-op: .34; --aurora-blend: screen; --shadow: 0 18px 50px rgba(0, 0, 0, .45);
  --m1: #6ef0d2; --m2: #ffcf6b; --m3: #a996ff; --m4: #ff9fc0; --m5: #7cc4ff; --m6: #b8f07a;
  --key: #182046; --key-edge: #070b1c; --scrim: rgba(3, 5, 14, .55);
  color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
html.lock, html.lock body { overflow: hidden; }
html.lock .shell { visibility: hidden; }
body {
  margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: var(--t-md); line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
a { color: inherit; }
:focus-visible { outline: 2.5px solid var(--aurora); outline-offset: 3px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
.mono { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--font-mono); font-size: var(--t-xs); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 34px; height: 34px; stroke-width: 1.5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- sky ---------- */
#sky { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.aurora { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.aurora i {
  position: absolute; width: 90vmax; height: 55vmax; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in oklab, var(--tint) 70%, transparent), transparent 100%);
  opacity: var(--aurora-op); mix-blend-mode: var(--aurora-blend); will-change: transform;
  animation: drift 46s ease-in-out infinite alternate;
}
.aurora i:nth-child(1) { left: -30vmax; top: -28vmax; }
.aurora i:nth-child(2) { right: -36vmax; top: 8vh; background: radial-gradient(closest-side, color-mix(in oklab, var(--aurora-2) 60%, transparent), transparent); animation-duration: 58s; animation-delay: -20s; }
.aurora i:nth-child(3) { left: 10vw; bottom: -40vmax; width: 70vmax; background: radial-gradient(closest-side, color-mix(in oklab, var(--tint) 45%, var(--aurora-2)), transparent); opacity: calc(var(--aurora-op) * .6); animation-duration: 64s; }
@keyframes drift { 0% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); } 50% { transform: translate3d(8vw, 4vh, 0) rotate(8deg) scale(1.12); } 100% { transform: translate3d(-6vw, 9vh, 0) rotate(-6deg) scale(.95); } }

/* ---------- shell ---------- */
.shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in oklab, var(--bg) 78%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.topbar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 16px; min-height: 64px; padding-block: 8px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; letter-spacing: .02em; min-height: 44px; }
.brand svg { width: 34px; height: 34px; overflow: visible; }
.brand .bl { stroke: var(--aurora); stroke-width: 1.4; fill: none; stroke-dasharray: 60; stroke-dashoffset: 60; animation: drawline 1.6s .2s var(--ease) forwards; }
.brand .bs { fill: var(--fg); transform-box: fill-box; transform-origin: center; animation: pop .5s var(--ease) both; }
.brand .bs:nth-of-type(2) { animation-delay: .35s; } .brand .bs:nth-of-type(3) { animation-delay: .6s; } .brand .bs:nth-of-type(4) { animation-delay: .85s; fill: var(--gold); }
@keyframes drawline { to { stroke-dashoffset: 0; } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.5); } 100% { transform: scale(1); } }
.nav { display: flex; gap: 4px; margin-left: 12px; }
.nav a { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 999px; text-decoration: none; color: var(--muted); font-weight: 700; font-size: var(--t-sm); transition: color .2s, background .2s; }
.nav a:hover { color: var(--fg); background: var(--panel); }
.nav a[aria-current="page"] { color: var(--fg); background: var(--panel-hi); box-shadow: inset 0 0 0 1px var(--line-strong); }
.chips { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-family: var(--font-mono); font-size: var(--t-sm); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip .ic { width: 18px; height: 18px; }
.chip.streak .ic { color: var(--gold); }
.chip.xp .ic { color: var(--aurora); }
.chip.on { animation: chipbump .6s var(--ease); }
@keyframes chipbump { 40% { transform: scale(1.15); } }
.who-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 6px 0 6px; border-radius: 999px; text-decoration: none; font-weight: 700; }
.who-chip span.nm { max-width: 9ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { --a: var(--aurora); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none; font-family: var(--font-display); font-weight: 800; font-size: .9rem; color: var(--on-accent); background: radial-gradient(circle at 30% 30%, color-mix(in oklab, var(--a) 60%, #fff), var(--a)); box-shadow: 0 0 18px color-mix(in oklab, var(--a) 50%, transparent); }
.avatar.b { --a: var(--gold); }
main { flex: 1; width: 100%; max-width: 1120px; margin: 0 auto; padding-block: 24px 64px; }
main:focus { outline: none; }
.tabbar { display: none; }

@media (max-width: 859px) {
  .nav, .who-chip .nm { display: none; }
  .topbar { position: relative; top: 0; background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; border-bottom: 0; }
  .topbar-in { min-height: 56px; }
  main { padding-block: 8px calc(150px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    display: grid; grid-template-columns: repeat(4, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 35;
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
    padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    background: color-mix(in oklab, var(--bg) 86%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; text-decoration: none; color: var(--faint); font-size: .72rem; font-weight: 700; border-radius: 14px; position: relative; }
  .tabbar a[aria-current="page"] { color: var(--fg); }
  .tabbar a[aria-current="page"] .ic { color: var(--aurora); filter: drop-shadow(0 0 8px var(--aurora)); }
  .tabbar a[aria-current="page"]::before { content: ""; position: absolute; top: -7px; width: 28px; height: 3px; border-radius: 3px; background: var(--aurora); box-shadow: 0 0 12px var(--aurora); }
}
@media (max-width: 380px) { .chip { padding: 0 9px; } .chip.xp .lbl { display: none; } .brand .word { font-size: .95rem; } }

/* ---------- generic ---------- */
.view { display: flex; flex-direction: column; gap: 36px; animation: viewin .45s var(--ease) both; }
@keyframes viewin { from { opacity: 0; transform: translateY(10px); } }
.rise { animation: rise .7s var(--ease) both; animation-delay: calc(var(--d, 0) * 70ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-lg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 700; text-decoration: none; transition: transform .12s, box-shadow .2s, background .2s, opacity .2s; user-select: none; -webkit-user-select: none; text-align: center; }
.btn.primary { --b: var(--aurora); background: var(--b); color: var(--on-accent); box-shadow: 0 4px 0 color-mix(in oklab, var(--b) 55%, #000), 0 10px 30px color-mix(in oklab, var(--b) 30%, transparent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 color-mix(in oklab, var(--b) 55%, #000); }
.btn.primary:disabled { background: var(--panel-hi); color: var(--faint); box-shadow: inset 0 0 0 1px var(--line); filter: none; transform: none; }
.btn.ghost { background: var(--panel); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line-strong); }
.btn.ghost:hover { background: var(--panel-hi); }
.btn.danger { background: var(--bad); color: #fff; box-shadow: 0 4px 0 color-mix(in oklab, var(--bad) 55%, #000); }
.btn.small { min-height: 44px; padding: 0 14px; font-size: var(--t-sm); }
.iconbtn { width: 44px; height: 44px; border-radius: 12px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.iconbtn:hover { color: var(--fg); background: var(--panel-hi); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-head h2 { font-family: var(--font-display); font-weight: 600; font-size: var(--t-xl); letter-spacing: -.01em; }
.sec-head p { color: var(--muted); max-width: 60ch; margin-top: 6px; }
.link { color: var(--aurora); font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.link:hover { text-decoration: underline; }
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 90; background: var(--panel-solid); border: 1px solid var(--line-strong); padding: 10px 18px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow); transition: .3s var(--ease); pointer-events: none; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
.hero .date { margin-bottom: 10px; }
.greet { font-family: var(--font-display); font-weight: 800; font-size: var(--t-2xl); line-height: 1.08; letter-spacing: -.02em; }
.greet .nm { background: linear-gradient(100deg, var(--aurora), var(--aurora-2) 60%, var(--gold)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.greet .w { display: inline-block; animation: rise .8s var(--ease) both; animation-delay: calc(var(--d) * 90ms + 150ms); }
.hero .sub { color: var(--muted); margin-top: 12px; max-width: 52ch; }
.dash { display: flex; gap: 12px; align-items: stretch; }
.stat { min-width: 108px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; justify-content: center; }
.stat .big { font-family: var(--font-display); font-weight: 600; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 8px; }
.stat .big .ic { width: 22px; height: 22px; }
.stat.streak .ic { color: var(--gold); }
.stat.xpst .ic { color: var(--aurora); }
.stat.streak.lit .ic { filter: drop-shadow(0 0 8px var(--gold)); animation: flick 2.4s ease-in-out infinite; }
@keyframes flick { 50% { transform: scale(1.1) rotate(-4deg); } }
.goal { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px; }
.ring { position: relative; width: 74px; height: 74px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .tr { fill: none; stroke: var(--line-strong); stroke-width: 7; }
.ring .pr { fill: none; stroke: var(--aurora); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 1s var(--ease); filter: drop-shadow(0 0 4px var(--aurora)); }
.ring .in { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.05; }
.ring .in small { display: block; font-family: var(--font-mono); font-weight: 500; font-size: .62rem; color: var(--muted); letter-spacing: .08em; }
.goal .gctl { display: flex; flex-direction: column; gap: 2px; align-items: center; }
.goal .gctl .mono { color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 2px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 1.3rem; font-weight: 700; color: var(--muted); }
.stepper button:hover { background: var(--panel-hi); color: var(--fg); }
.stepper output { min-width: 2ch; text-align: center; font-weight: 700; font-family: var(--font-mono); }
@media (max-width: 859px) {
  .hero { grid-template-columns: 1fr; }
  .dash { display: grid; grid-template-columns: 1fr 1fr; }
  .dash .goal { grid-column: 1 / -1; }
}

.cont { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 18px; align-items: center; padding: 18px 20px; text-decoration: none; border-color: color-mix(in oklab, var(--c, var(--aurora)) 40%, var(--line)); }
.cont::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px 200px at 0% 50%, color-mix(in oklab, var(--c, var(--aurora)) 22%, transparent), transparent 70%); pointer-events: none; }
.cont > * { position: relative; }
.cont .orb { width: 64px; height: 64px; }
.cont h3 { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin-top: 4px; }
.cont p { color: var(--muted); font-size: var(--t-sm); margin-top: 4px; }
.cont .btn { --b: var(--c, var(--aurora)); color: var(--on-c, var(--on-accent)); }
.cont.skeleton { min-height: 104px; }
@media (max-width: 600px) { .cont { grid-template-columns: auto minmax(0, 1fr); } .cont .btn { grid-column: 1 / -1; width: 100%; } }
.review { display: flex; align-items: center; gap: 16px; padding: 16px 20px; flex-wrap: wrap; }
.review .rv-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in oklab, var(--bad) 18%, transparent); color: var(--bad); flex: none; }
.review .txt { flex: 1 1 200px; min-width: 0; }
.review h3 { font-weight: 700; font-size: 1.05rem; }
.review p { color: var(--muted); font-size: var(--t-sm); }

/* course cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.ccard {
  --c: var(--aurora); --mx: 50%; --my: 0%; position: relative; display: flex; flex-direction: column; gap: 10px; padding: 20px; min-height: 220px;
  text-decoration: none; border-radius: var(--r-lg); background: var(--panel); border: 1px solid var(--line); overflow: hidden; isolation: isolate;
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .4s var(--ease), border-color .3s, box-shadow .3s;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.ccard::before { content: ""; position: absolute; inset: 0; z-index: -1; background: radial-gradient(420px 260px at var(--mx) var(--my), color-mix(in oklab, var(--c) 26%, transparent), transparent 70%); opacity: .75; transition: opacity .3s; }

@media (max-width: 640px) { .chead { grid-template-columns: 1fr; gap: 8px; } .bigorb { width: 112px; height: 112px; } .bigorb .ic { width: 40px; height: 40px; } .chead .btn { width: 100%; } }

.node { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; }

.phead { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

const sky = (() => {
  const cv = $('#sky'), ctx = cv.getContext('2d');

  function gen() {
    const n = Math.min(260, Math.round((W * H) / 5200));
    stars = Array.from({ length: n }, () => {
      const r = Math.random();
      return { x: Math.random() * W, y: Math.random() * H, s: r < 0.7 ? 0.5 + Math.random() * 0.5 : r < 0.95 ? 1 + Math.random() * 0.6 : 1.7 + Math.random() * 0.7, a: 0.35 + Math.random() * 0.6, tw: 0.4 + Math.random() * 1.8, ph: Math.random() * 6.28, z: 0.2 + Math.random() * 0.8, t: Math.random() < 0.12 };
    });

    const dpr = Math.min(1.5, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      x = ((x % (W + 10)) + (W + 10)) % (W + 10) - 5;
      let y = s.y - sc * 0.06 * s.z;
      y = ((y % (H + 10)) + (H + 10)) % (H + 10) - 5;
      const a = (still ? s.a : s.a * (0.6 + 0.4 * Math.sin(t * 0.001 * s.tw + s.ph))) * mult;
      ctx.fillStyle = `rgba(${s.t && tintRgb ? tintRgb : rgb},${a.toFixed(3)})`;

        ctx.beginPath(); ctx.moveTo(x - s.s * 3.2, y); ctx.lineTo(x + s.s * 3.2, y); ctx.moveTo(x, y - s.s * 3.2); ctx.lineTo(x, y + s.s * 3.2); ctx.stroke();

    }

      if (nextShoot) { const dir = Math.random() < 0.5 ? -1 : 1; shoot = { x: W * (0.2 + Math.random() * 0.6), y: H * Math.random() * 0.35, vx: dir * (0.5 + Math.random() * 0.3), vy: 0.22 + Math.random() * 0.12, t0: t }; }

    if (e.isComposing) return;
    if (tag === 'TEXTAREA') { if (e.ctrlKey || e.metaKey) { e.preventDefault(); primary(); } return; }
    if (t.closest && (t.closest('[data-kbd="native"]') || t.closest('.order') || t.closest('.match') || t.closest('.l-actions') || t.closest('a'))) return;
    if (t.closest && t.closest('.opt') && !t.classList.contains('sel') && (ph === 'answer' || ph === 'wrong')) return;
    e.preventDefault(); primary(); return;
  }
  if (tag === 'INPUT' || tag === 'TEXTAREA' || e.ctrlKey || e.metaKey || e.altKey) return;
  if ((ph === 'answer' || ph === 'wrong') && C && C.pick) {
    if (/^[1-9]$/.test(e.key)) { e.preventDefault(); C.pick(+e.key - 1); }
    else if (C.tf && (e.key === 't' || e.key === 'f' || e.key === 'T' || e.key === 'F')) { e.preventDefault(); C.pick(e.key.toLowerCase() === 't' ? 0 : 1); }
  }
});

document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const l = S.learners.find((x) => x.id === f.dataset.form); if (!l) return;
  const v = String(new FormData(f).get('nm') || '').trim().slice(0, 24);
  if (v) l.name = v;
  editing = null; save(); render();
  const b = $(`[data-edit="${l.id}"]`, view); if (b) b.focus({ preventScroll: true });
});

function withCourse(id, fn) { getCourse(id).then(fn).catch(() => toast("Couldn't load that course. Try again.")); }
document.addEventListener('click', (e) => {
  if (LS.contains(e.target)) return;
  const t = e.target.closest('button, a, [data-play]'); if (!t) return;
  const ds = t.dataset;
  if (ds.calcOpen != null) { calc.open({ opener: t }); return; }
  if (ds.tipnext != null) { nextTip(); return; }
  if (ds.play) { e.preventDefault(); const [cid, gi] = ds.play.split('|'); withCourse(cid, (c) => openLesson(c, +gi)); return; }
  if (ds.lv != null) {
    const r = route(); const c = courses[r.id]; if (!c) return;
    const gi = +ds.lv, s = lvState(c);
    if (s.open[gi]) return openLesson(c, gi);
    const prev = c.flat[s.cur >= 0 ? s.cur : 0];
    openSheet(`<h2 id="shT">This star is still dark</h2><p>Levels light up in order. ${prev ? `“${esc(prev.l.title)}” comes next on your path, but` : 'But'} you can jump ahead if you already know the earlier material.</p><div class="row"><button type="button" class="btn ghost" data-close>Not yet</button><button type="button" class="btn primary" data-jump="${esc(c.id)}|${gi}">Jump ahead anyway</button></div>`);
    return;
  }
  if (ds.close != null) return closeSheet();
  if (ds.jump) { const [cid, gi] = ds.jump.split('|'); closeSheet(true); withCourse(cid, (c) => openLesson(c, +gi)); return; }
  if (ds.review != null) { if (!t.disabled) openReview(); return; }
  if (ds.reload != null) { catP = null; lastRoute = null; render(); return; }
  if (ds.pick) {
    const changedLearner = S.active !== ds.pick;
    S.active = ds.pick; whoMode = false; editing = null; save();
    if (changedLearner) { exportCode = ''; importText = ''; importState = null; resetAsk = false; }
    if (location.hash !== '#home') location.hash = '#home'; else { lastRoute = null; render(); }
    return;
  }
  if (ds.edit) { editing = ds.edit; render(); const i = $(`#nm-${ds.edit}`, view); if (i) { i.focus(); i.select(); } return; }
  if (ds.whocancel != null) { const id = editing; editing = null; render(); const b = $(`[data-edit="${id}"]`, view); if (b) b.focus(); return; }
  if (ds.cancel != null) { whoMode = false; editing = null; render(); return; }
  if (ds.switch != null) { whoMode = true; editing = null; render(); return; }
  if (ds.goal) {
    const d = L(); d.goal = Math.min(10, Math.max(1, d.goal + +ds.goal)); save();
    if (route().name === 'profile') keepFocus(render); else updGoal();
    return;
  }
  if (ds.cal) { calMode = ds.cal; keepFocus(render); return; }
  if (ds.export != null) { exportCode = makeCode(); keepFocus(render); const x = $('#exCode'); if (x) { x.focus(); x.select(); } return; }
  if (ds.copy != null) {
    const x = $('#exCode'); if (!x) return;
    const fallback = () => { x.focus(); x.select(); toast('Code selected. Press Ctrl+C or Copy to copy it.'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(x.value).then(() => toast('Code copied'), fallback);
      else fallback();
    } catch (err) { fallback(); }
    return;
  }
  if (ds.import != null) {
    const ta = $('#imCode'); importText = ta ? ta.value : importText;
    try { importState = { ok: readCode(importText) }; } catch (err) { importState = { err: err.message }; }
    keepFocus(render); return;
  }
  if (ds.imp) {
    if (ds.imp === 'cancel' || !importState || !importState.ok) { importState = null; keepFocus(render); return; }
    const inc = importState.ok.data, id = S.active || 'a';
    S.data[id] = ds.imp === 'replace' ? normLearner(JSON.parse(JSON.stringify(inc))) : mergeData(S.data[id], inc);
    save(); importText = ''; exportCode = '';
    importState = { done: ds.imp === 'replace' ? `Replaced. ${me().name}'s progress now matches the code.` : `Merged. ${me().name} keeps the best of both.` };
    render(); const n = $('#imCode'); if (n) n.focus({ preventScroll: true });
    return;
  }
  if (ds.themeSet) { S.theme = ds.themeSet; save(); applyTheme(); keepFocus(render); return; }
  if (ds.reset != null) { resetAsk = true; keepFocus(render); const b = $('[data-reset-no]'); if (b) b.focus(); return; }
  if (ds.resetNo != null) { resetAsk = false; render(); const b = $('[data-reset]'); if (b) b.focus(); return; }
  if (ds.resetYes != null) {
    S.data[S.active || 'a'] = blank(); resetAsk = false; exportCode = ''; importState = null; save();
    render(); toast('Progress erased. A fresh sky.'); const b = $('[data-reset]'); if (b) b.focus();
    return;
  }
});
document.addEventListener('input', (e) => { if (e.target.id === 'imCode') { importText = e.target.value; } });

view.addEventListener('animationend', (e) => { if (e.animationName === 'rise' && e.target.classList.contains('rise')) e.target.classList.remove('rise'); });
view.addEventListener('pointermove', (e) => {
  if (!FINEq.matches || RM()) return;
  const c = e.target.closest && e.target.closest('.ccard'); if (!c) return;
  const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  c.style.setProperty('--mx', (px * 100).toFixed(1) + '%'); c.style.setProperty('--my', (py * 100).toFixed(1) + '%');
  c.style.setProperty('--rx', ((0.5 - py) * 7).toFixed(2) + 'deg'); c.style.setProperty('--ry', ((px - 0.5) * 9).toFixed(2) + 'deg');
});
view.addEventListener('pointerout', (e) => {
  const c = e.target.closest && e.target.closest('.ccard');
  if (c && !c.contains(e.relatedTarget)) { c.style.removeProperty('--rx'); c.style.removeProperty('--ry'); }
});

window.addEventListener('hashchange', () => { if (calc.isModal()) calc.close(true); if (!LS.hidden) closeLesson(true); render(); });

/* ================= boot ================= */
applyTheme();
sky.start();
render();
})();
</script>

</body>
</html>
